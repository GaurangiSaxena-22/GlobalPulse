name: Daily Intelligence Ingestion

on:
  schedule:
    # Runs at 2:00 AM UTC (which is 7:30 AM IST for you!)
    - cron: '0 2 * * *'
  workflow_dispatch: # This adds a manual "Run Workflow" button for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up the run by caching libraries
        
    - name: Install Dependencies
      run: pip install -r requirements.txt
        
    - name: Run News Pipeline
      env:
        # We pull keys securely from GitHub Secrets
        GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python main.py
